# This opens a PR each week for every action the CI and release workflows pin that has a newer
# release. The review stub calls code-review's workflow at @main, so claude-code-action's pin
# lives there, not here. None of these actions ship in the plugin, so the PRs keep Dependabot's
# chore(deps) titles and cut no release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
